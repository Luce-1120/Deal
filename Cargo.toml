[package]
name = "deal"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"
figlet-rs = "1.0"
anyhow = "1"
gix = { version = "0.86", features = [
    "status",
    "index",
    "revision",
    "blob-diff",
    "tree-editor",
] }
tree-sitter = "0.26"
tree-sitter-language-pack = "1"
similar = "3"
tempfile = "3"
unicode-width = "0.2"
dirs = "6"

[[bin]]
name = "deal"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true